# Tiling on a 49" ultrawide with Hammerspoon: each shortcut puts the window in
# a range of the screen's width, in percent. Shift makes it wider.
hammerspoon config linked
hammerspoon tile cmd+opt+left 0-25
hammerspoon tile cmd+opt+up 35-75
hammerspoon tile cmd+opt+right 85-100
hammerspoon tile cmd+shift+opt+left 0-30
hammerspoon tile cmd+shift+opt+up 30-80
hammerspoon tile cmd+shift+opt+right 80-100
# Hammerspoon does the tiling; macOS's own would compete with it.
windows native-tiling false
