# 1Password CLI (op): reads secrets and powers shell plugins.
brew cask 1password-cli
# GitHub from the command line: auth, repos, SSH keys.
brew formula gh
# Prompt for zsh, loaded by config/shell/prompt.zsh.
brew formula starship
# Varlock: env secrets from 1Password, resolved per process (docs/secrets.md).
brew tap dmno-dev/tap
brew formula dmno-dev/tap/varlock
# Vercel from the command line: deployments, logs, env (docs/auth/vercel.md).
brew formula vercel
